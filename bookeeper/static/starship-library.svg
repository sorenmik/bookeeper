<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 154">
  <style>
    .flame { transform-origin: 70px 78px; animation: thrust .35s ease-in-out infinite alternate; }
    .ship { animation: hover 4s ease-in-out infinite alternate; }
    .ring { animation: spin 40s linear infinite; transform-origin: 0 0; }
    .blink { animation: blink 1.6s steps(2, start) infinite; }
    @keyframes thrust { from { transform: scaleX(.85); } to { transform: scaleX(1.12); } }
    @keyframes hover { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .flame, .ship, .ring, .blink { animation: none; } }
  </style>
  <defs>
    <radialGradient id="space" cx=".6" cy=".3" r=".9">
      <stop offset="0" stop-color="#2a1a5e"/>
      <stop offset=".55" stop-color="#0b0f2e"/>
      <stop offset="1" stop-color="#03040d"/>
    </radialGradient>
    <radialGradient id="neb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff4fb8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3be3ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#3be3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#9dffcf"/>
      <stop offset=".5" stop-color="#2a9f8f"/>
      <stop offset="1" stop-color="#0b2a3a"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset=".55" stop-color="#9fb3d9"/>
      <stop offset="1" stop-color="#4f5f86"/>
    </linearGradient>
    <linearGradient id="fire" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#7ff3ff"/>
      <stop offset="1" stop-color="#4d6bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rock" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8a7f9e"/>
      <stop offset="1" stop-color="#2e2840"/>
    </radialGradient>
    <clipPath id="port1"><circle cx="118" cy="70" r="8"/></clipPath>
    <clipPath id="port2"><circle cx="140" cy="70" r="8"/></clipPath>
    <clipPath id="port3"><circle cx="162" cy="70" r="8"/></clipPath>
  </defs>

  <rect width="344" height="154" fill="url(#space)"/>
  <ellipse cx="250" cy="40" rx="110" ry="40" fill="url(#neb)"/>
  <ellipse cx="60" cy="120" rx="90" ry="40" fill="url(#neb2)"/>
  <g fill="#fff">
    <circle cx="14" cy="18" r=".8"/><circle cx="40" cy="44" r=".6"/><circle cx="76" cy="12" r="1"/>
    <circle cx="102" cy="30" r=".6"/><circle cx="134" cy="16" r=".9"/><circle cx="170" cy="36" r=".6"/>
    <circle cx="196" cy="10" r=".8"/><circle cx="224" cy="58" r=".6"/><circle cx="256" cy="20" r="1"/>
    <circle cx="300" cy="34" r=".7"/><circle cx="330" cy="12" r=".9"/><circle cx="318" cy="64" r=".6"/>
    <circle cx="210" cy="140" r=".7"/><circle cx="180" cy="122" r=".6"/><circle cx="24" cy="80" r=".7"/>
    <circle cx="88" cy="138" r=".6"/><circle cx="150" cy="140" r=".8"/><circle cx="236" cy="96" r=".6"/>
  </g>
  <path d="M276 22h10M281 17v10" stroke="#cfe8ff" stroke-width=".8"/>

  <!-- Planet with a ring of overdue books -->
  <circle cx="284" cy="118" r="30" fill="url(#planet)"/>
  <path d="M260 108c14 4 34 4 48-2M258 122c18 4 36 4 52-2" stroke="#d7fff0" stroke-width="2" fill="none" opacity=".35"/>
  <g transform="translate(284 118) scale(1 .32)">
    <g class="ring">
      <g fill="#ff5fd2"><rect x="44" y="-6" width="7" height="12" rx="1"/></g>
      <g fill="#4de8ff"><rect x="-51" y="-6" width="7" height="12" rx="1"/></g>
      <g fill="#ffd35f"><rect x="-4" y="40" width="7" height="12" rx="1"/></g>
      <g fill="#9b7bff"><rect x="-4" y="-52" width="7" height="12" rx="1"/></g>
      <g fill="#7dff9a"><rect x="30" y="31" width="7" height="12" rx="1" transform="rotate(45 33 37)"/></g>
      <g fill="#ff8a5f"><rect x="-37" y="-43" width="7" height="12" rx="1" transform="rotate(45 -33 -37)"/></g>
      <g fill="#ffd35f"><rect x="-37" y="31" width="7" height="12" rx="1" transform="rotate(-45 -33 37)"/></g>
      <g fill="#4de8ff"><rect x="30" y="-43" width="7" height="12" rx="1" transform="rotate(-45 33 -37)"/></g>
    </g>
  </g>
  <path d="M244 124c10 10 70 10 80 -12" stroke="#e8f1ff" stroke-width="1" fill="none" opacity=".35"/>
  <text x="238" y="152" textLength="92" lengthAdjust="spacingAndGlyphs" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="6" letter-spacing=".8" fill="#9fb3d9">RING OF OVERDUE BOOKS</text>

  <!-- The library ship -->
  <g class="ship">
    <path class="flame" d="M70 72c-16-4-34-2-48 6 14 8 32 10 48 6z" fill="url(#fire)"/>
    <path d="M70 62h104c20 0 36 8 44 16-8 8-24 16-44 16H70c-4-5-4-27 0-32z" fill="url(#hull)"/>
    <path d="M96 62l14-16h40l10 16zM96 94l14 16h40l10-16z" fill="#6c7fa8"/>
    <path d="M110 46h40l4 6h-48z" fill="#4de8ff" opacity=".6"/>
    <path d="M196 70c8 1 15 4 20 8-5 2-12 4-20 4z" fill="#1b2a55"/>
    <path d="M200 72c5 1 9 3 12 5" stroke="#7ff3ff" stroke-width="1" fill="none"/>
    <g>
      <circle cx="118" cy="70" r="8.8" fill="#1b2a55"/>
      <circle cx="140" cy="70" r="8.8" fill="#1b2a55"/>
      <circle cx="162" cy="70" r="8.8" fill="#1b2a55"/>
      <g clip-path="url(#port1)">
        <rect x="110" y="62" width="16" height="16" fill="#ffe7b0"/>
        <rect x="111" y="64" width="3" height="10" fill="#ff5fd2"/><rect x="114" y="65" width="3" height="9" fill="#4de8ff"/>
        <rect x="117" y="63" width="3" height="11" fill="#9b7bff"/><rect x="120" y="66" width="3" height="8" fill="#ffd35f"/>
        <rect x="123" y="64" width="3" height="10" fill="#7dff9a"/>
        <path d="M110 74.5h16" stroke="#6b4a2a" stroke-width="1.5"/>
      </g>
      <g clip-path="url(#port2)">
        <rect x="132" y="62" width="16" height="16" fill="#ffe7b0"/>
        <rect x="133" y="65" width="3" height="9" fill="#4de8ff"/><rect x="136" y="63" width="3" height="11" fill="#ff8a5f"/>
        <rect x="139" y="66" width="3" height="8" fill="#9b7bff"/><rect x="142" y="64" width="4" height="10" fill="#ff5fd2" transform="rotate(14 144 74)"/>
        <path d="M132 74.5h16" stroke="#6b4a2a" stroke-width="1.5"/>
      </g>
      <g clip-path="url(#port3)">
        <rect x="154" y="62" width="16" height="16" fill="#ffe7b0"/>
        <!-- The librarian droid -->
        <rect x="157" y="65" width="10" height="8" rx="2" fill="#9fb3d9"/>
        <circle cx="160" cy="69" r="1.3" fill="#ff3b5c"/>
        <circle cx="164" cy="69" r="1.3" fill="#ff3b5c"/>
        <path d="M162 65v-3" stroke="#9fb3d9"/>
        <circle class="blink" cx="162" cy="61.5" r="1" fill="#ff3b5c"/>
        <path d="M156 77h12" stroke="#6b4a2a" stroke-width="2"/>
      </g>
      <circle cx="118" cy="70" r="8.8" fill="none" stroke="#4f5f86" stroke-width="1.5"/>
      <circle cx="140" cy="70" r="8.8" fill="none" stroke="#4f5f86" stroke-width="1.5"/>
      <circle cx="162" cy="70" r="8.8" fill="none" stroke="#4f5f86" stroke-width="1.5"/>
    </g>
    <text x="92" y="89" textLength="96" lengthAdjust="spacingAndGlyphs" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="5.6" font-weight="700" letter-spacing="1" fill="#1b2a55">INTERGALACTIC LENDING LIBRARY</text>
    <circle class="blink" cx="216" cy="78" r="1.4" fill="#ff5f7a"/>
    <!-- Shush -->
    <path d="M206 50h44a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5h-30l-10 8 3-8h-7a5 5 0 0 1-5-5V55a5 5 0 0 1 5-5z" fill="#f2f7ff" transform="translate(-10 -40)"/>
    <text x="203" y="25.5" textLength="30" lengthAdjust="spacingAndGlyphs" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#1b2a55">SHHH!</text>
  </g>

  <!-- Commuter alien catching up on reading -->
  <ellipse cx="40" cy="134" rx="34" ry="14" fill="url(#rock)"/>
  <circle cx="26" cy="132" r="3" fill="#221d33"/><circle cx="54" cy="138" r="2" fill="#221d33"/>
  <path d="M30 122c-2-10 2-18 10-18s12 8 10 18z" fill="#56e39f"/>
  <path d="M34 106l-4-8m16 8 4-8" stroke="#56e39f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="30" cy="97.5" r="2" fill="#ff5fd2"/><circle cx="50" cy="97.5" r="2" fill="#ff5fd2"/>
  <circle cx="35.5" cy="110" r="2.2" fill="#fff"/><circle cx="40" cy="108.5" r="2.4" fill="#fff"/><circle cx="44.5" cy="110" r="2.2" fill="#fff"/>
  <circle cx="36" cy="111" r="1" fill="#03040d"/><circle cx="40.5" cy="109.5" r="1.1" fill="#03040d"/><circle cx="45" cy="111" r="1" fill="#03040d"/>
  <path d="M30 118l10 3 10-3v8l-10 3-10-3z" fill="#ffd35f" stroke="#a07a1a" stroke-width=".6"/>
  <path d="M40 121v8" stroke="#a07a1a" stroke-width=".6"/>
  <path d="M60 118c3-2 6-2 8 0v6c-2 2-5 2-8 0z" fill="#e8f1ff"/>
  <path d="M68 120c2 0 2 3 0 3" stroke="#e8f1ff" fill="none"/>
  <path d="M62 116c0-2 1-3 0-5m3 5c0-2 1-3 0-5" stroke="#cfe8ff" stroke-width=".6" fill="none" opacity=".8"/>
</svg>
