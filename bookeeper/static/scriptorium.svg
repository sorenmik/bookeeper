    <path d="M236 65c-2 3-2 5 0 7 2-2 2-4 0-7z" fill="#fff1c1"/>
  </g>

  <!-- Scrolls on the floor -->
  <g stroke="#8a6a44" stroke-width=".8">
    <rect x="246" y="128" width="26" height="9" rx="4.5" fill="#e7d3a6"/>
    <rect x="250" y="119" width="22" height="9" rx="4.5" fill="#d9c08e"/>
