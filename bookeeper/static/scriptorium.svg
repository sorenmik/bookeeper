<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 154">
  <style>
    .flame { transform-origin: 236px 70px; animation: flicker 2.4s ease-in-out infinite alternate; }
    .glow { animation: breathe 3.1s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1, 1) rotate(-2deg); } 40% { transform: scale(.92, 1.08) rotate(2deg); } 100% { transform: scale(1.04, .95) rotate(-1deg); } }
    @keyframes breathe { from { opacity: .55; } to { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .flame, .glow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a1b"/>
      <stop offset="1" stop-color="#1d130b"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc95"/>
      <stop offset="1" stop-color="#b8742a"/>
    </linearGradient>
    <radialGradient id="candlelight" cx="236" cy="66" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#e09a3a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e09a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e5130"/>
      <stop offset=".5" stop-color="#9c7a4a"/>
      <stop offset="1" stop-color="#5c4227"/>
    </linearGradient>
    <pattern id="stones" width="28" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 13.5h28M14 0v14M0 0v7M0 6.5h14" stroke="#120b06" stroke-opacity=".45" fill="none"/>
    </pattern>
    <pattern id="lattice" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v8M0 0h8" stroke="#4a2f17" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="344" height="154" fill="url(#wall)"/>
  <rect width="344" height="138" fill="url(#stones)"/>
  <rect class="glow" width="344" height="154" fill="url(#candlelight)"/>

  <!-- Lancet window -->
