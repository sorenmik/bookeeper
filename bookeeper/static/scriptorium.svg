  <path d="M202 93l9-3m-8 5l9-3m6-3l9-3m-8 6l8-3" stroke="#3b2414" stroke-width=".7"/>
  <rect x="203.5" y="89.5" width="3" height="3" fill="#8f1f18" transform="rotate(-18 205 91)"/>
