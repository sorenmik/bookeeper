<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 154">
  <style>
    .fly { animation: glow 3s ease-in-out infinite; }
    .fly:nth-of-type(2n) { animation-duration: 3.8s; animation-delay: -1.2s; }
    .fly:nth-of-type(3n) { animation-duration: 2.6s; animation-delay: -2s; }
    .steam { animation: rise 3.5s ease-in-out infinite alternate; }
    .page { transform-origin: 170px 109px; animation: turn 9s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: .3; transform: translateY(1px); } to { opacity: .8; transform: translateY(-2px); } }
    @keyframes turn { 0%, 85%, 100% { transform: scaleX(1); } 92% { transform: scaleX(-1); } }
    @media (prefers-reduced-motion: reduce) { .fly, .steam, .page { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f6b"/>
      <stop offset=".35" stop-color="#7d5592"/>
      <stop offset=".62" stop-color="#ec9165"/>
      <stop offset=".8" stop-color="#ffc77a"/>
      <stop offset="1" stop-color="#ffe0a3"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="292" cy="96" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2c4" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#ffc56b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="52" cy="58" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset=".35" stop-color="#e9ff6a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d4ff4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7da24a"/>
      <stop offset=".5" stop-color="#4c7034"/>
      <stop offset="1" stop-color="#2f4a24"/>
    </linearGradient>
    <pattern id="check" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <rect width="6" height="6" fill="#c9483a"/>
      <rect width="3" height="3" fill="#f6e6d0" opacity=".85"/>
      <rect x="3" y="3" width="3" height="3" fill="#a8321f" opacity=".6"/>
    </pattern>
  </defs>

  <rect width="344" height="154" fill="url(#sky)"/>
  <g fill="#fff8e6">
    <circle cx="22" cy="12" r=".7"/><circle cx="86" cy="8" r=".6"/><circle cx="130" cy="18" r=".8"/>
    <circle cx="232" cy="10" r=".6"/><circle cx="300" cy="16" r=".7"/><circle cx="66" cy="26" r=".5"/>
  </g>

  <!-- Moon rising, sun setting -->
  <circle cx="52" cy="58" r="30" fill="url(#moonglow)"/>
  <circle cx="52" cy="58" r="10" fill="#fff6e4"/>
  <circle cx="49" cy="55" r="2.2" fill="#ecd3ad" opacity=".6"/><circle cx="56" cy="61" r="1.5" fill="#ecd3ad" opacity=".6"/>
  <circle cx="292" cy="96" r="110" fill="url(#sunglow)"/>
  <circle cx="292" cy="96" r="15" fill="#fff4d0"/>
  <ellipse cx="262" cy="84" rx="40" ry="2" fill="#ffd9a0" opacity=".7"/>
  <ellipse cx="300" cy="92" rx="30" ry="1.6" fill="#ffb98a" opacity=".7"/>
  <path d="M244 64q2-2 4 0q2-2 4 0M254 70q1.5-1.5 3 0q1.5-1.5 3 0" stroke="#3a2a3e" stroke-width=".9" fill="none" stroke-linecap="round"/>

  <!-- Hills -->
  <path d="M0 110C70 98 140 104 200 108S300 100 344 104V154H0z" fill="#9a7590"/>
  <path d="M0 124C60 116 120 118 180 122S300 126 344 118V154H0z" fill="#4f6b3c"/>
  <path d="M180 122C240 126 300 126 344 118" stroke="#ffd27a" stroke-width="1" fill="none" opacity=".8"/>
  <path d="M0 138C80 132 200 134 344 136V154H0z" fill="#3a5430"/>

  <!-- Apple tree -->
  <path d="M190 132c2-16 1-30-4-44h9c3 14 6 28 9 44z" fill="#4a3020"/>
  <path d="M190 96l-18-18M194 90l18-20M189 100l-10-16" stroke="#4a3020" stroke-width="3.2" stroke-linecap="round"/>
  <g fill="url(#leaf)">
    <circle cx="168" cy="66" r="18"/><circle cx="186" cy="52" r="20"/><circle cx="208" cy="50" r="20"/>
    <circle cx="224" cy="66" r="17"/><circle cx="196" cy="72" r="18"/><circle cx="176" cy="80" r="12"/><circle cx="216" cy="80" r="12"/>
  </g>
  <g fill="#a9c560" opacity=".45">
    <circle cx="228" cy="60" r="8"/><circle cx="214" cy="42" r="7"/><circle cx="234" cy="72" r="5"/>
  </g>
  <g fill="#d2412f">
    <circle cx="170" cy="74" r="3"/><circle cx="188" cy="60" r="3"/><circle cx="210" cy="58" r="3"/>
    <circle cx="224" cy="72" r="3"/><circle cx="200" cy="80" r="3"/><circle cx="180" cy="50" r="3"/><circle cx="214" cy="42" r="3"/>
  </g>
  <g fill="#fff" opacity=".6">
    <circle cx="171" cy="73" r=".9"/><circle cx="189" cy="59" r=".9"/><circle cx="211" cy="57" r=".9"/>
    <circle cx="225" cy="71" r=".9"/><circle cx="201" cy="79" r=".9"/><circle cx="181" cy="49" r=".9"/><circle cx="215" cy="41" r=".9"/>
  </g>

  <!-- Picnic blanket -->
  <path d="M118 130l60-5 8 11-62 5z" fill="url(#check)"/>

  <!-- Reader against the trunk -->
  <path d="M178 126l-14-14-14 18 5 1 10-12 15 10z" fill="#34465f"/>
  <path d="M180 124l-30 4v6l31-3z" fill="#3d5170"/>
  <ellipse cx="148" cy="131.5" rx="3.2" ry="2" fill="#2b2420"/>
  <ellipse cx="152.5" cy="130" rx="3" ry="1.8" fill="#2b2420"/>
  <path d="M176 128c-1-10 2-18 10-21 6 2 7 11 6 21z" fill="#e0a83a"/>
  <path d="M185 111c-4 1-8 1-12 0" stroke="#e0a83a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="185" cy="101" r="6" fill="#f1c7a0"/>
  <path d="M179 100a6 6 0 0 1 12 0c0 3-1 6-3 7 1-3 0-6-3-7-3 0-5 1-6 0z" fill="#6b3b22"/>
  <path d="M181.5 102.5h2" stroke="#3b2414" stroke-width=".8" stroke-linecap="round"/>
  <circle cx="181.5" cy="104.5" r="1.1" fill="#e69a84" opacity=".6"/>
  <path d="M162 104l8 3 8-3v10l-8 3-8-3z" fill="#fff6e2" stroke="#8a6a44" stroke-width=".5"/>
  <path d="M170 107v10" stroke="#8a6a44" stroke-width=".5"/>
  <path class="page" d="M170 107l-6-2v9l6 2z" fill="#fbecd0"/>
  <path d="M162 114l8 3 8-3" stroke="#b23a26" stroke-width="1" fill="none"/>
  <circle cx="172" cy="111" r="1.8" fill="#f1c7a0"/>

  <!-- Basket of apples and a cup of tea -->
  <path d="M126 116a8 8 0 0 1 16 0" stroke="#8a5a2a" stroke-width="1.3" fill="none"/>
  <circle cx="129" cy="121" r="3" fill="#d2412f"/><circle cx="134.5" cy="120" r="3" fill="#8fb04a"/><circle cx="140" cy="121" r="3" fill="#d2412f"/>
  <path d="M124 122h20l-2 9h-16z" fill="#b07d42"/>
  <path d="M125 125h18M125.5 128h17" stroke="#7a5228" stroke-width=".7"/>
  <circle cx="160" cy="136" r="2.6" fill="#d2412f"/>
  <path d="M145 128h7l-1 4h-5z" fill="#fff6e2"/>
  <path d="M152 129c2 0 2 2 0 2" stroke="#fff6e2" stroke-width=".8" fill="none"/>
  <ellipse cx="148.5" cy="132.3" rx="5" ry="1" fill="#e9dcc6"/>
  <path class="steam" d="M147 126c-1-2 1-3 0-5M150 126c-1-2 1-3 0-5" stroke="#fff" stroke-width=".7" fill="none" opacity=".7"/>

  <!-- Grass -->
  <g stroke="#2b4226" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M8 154q1-6-1-11M14 154q0-5 3-9M60 154q-1-6 2-10M100 154q1-5-1-9M230 154q0-6 3-10M262 154q-1-5 1-9M300 154q1-6-2-11M330 154q0-5 2-8"/>
  </g>

  <!-- Fireflies -->
  <g>
    <g class="fly"><circle cx="62" cy="104" r="5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="104" cy="96" r="4" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="140" cy="86" r="5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="240" cy="96" r="4.5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="252" cy="118" r="4" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="90" cy="124" r="5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="228" cy="130" r="4" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="156" cy="94" r="3.5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="312" cy="132" r="5" fill="url(#halo)"/></g>
    <g class="fly"><circle cx="30" cy="132" r="4" fill="url(#halo)"/></g>
  </g>
</svg>
