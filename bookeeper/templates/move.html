{% macro target_select(groups, label='Move to', exclude='') -%}
<label>{{ label }}
    <select name="target">
        <option value="">Unplaced</option>
        {% for group, options in groups %}
        <optgroup label="{{ group }}">
            {% for id, name in options if id != exclude %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
        </optgroup>
        {% endfor %}
    </select>
</label>
{%- endmacro %}
