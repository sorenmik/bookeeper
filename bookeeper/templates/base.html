<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bookeeper{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a class="brand" href="{{ url_for('home') }}">Bookeeper</a>
            {% if g.user %}
                <a href="{{ url_for('catalog') }}">Catalog</a>
                <a href="{{ url_for('locations') }}">Locations</a>
                <a href="{{ url_for('household.wishlist') }}">Wishlist</a>
                <a href="{{ url_for('household.loans') }}">Loans</a>
                <a href="{{ url_for('household.stats') }}">Stats</a>
                <a href="{{ url_for('household.sorting') }}">Sorting</a>
                {% if g.owner %}<a href="{{ url_for('backups.index') }}">Backup</a>{% endif %}
                <a class="qr-link" href="{{ url_for('household.connect') }}"><img src="{{ url_for('household.qr') }}" width="27" height="27" alt=""> Connect</a>
                <form class="account" action="{{ url_for('logout') }}" method="post">
                    <input type="hidden" name="csrf" value="{{ session.csrf }}">
                    <button type="submit">Sign out ({{ g.user }})</button>
                </form>
            {% endif %}
            <label class="theme-control">Theme <select id="theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        </nav>
    </header>
    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <p class="notice {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
